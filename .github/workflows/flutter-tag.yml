name: Flutter Tag Build

# SystemDesk builds are started by dev/release-app.js (Build the flutter version of SystemDesk, workflow_dispatch). This upstream tag trigger could
# not even start (startup failure) and sent a "build failed" mail on every version tag, so it only runs when started by hand.
on:
  workflow_dispatch:

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}