name: Full Flutter CI

# Manual only. It used to run on every push / pull request, but it never started ("startup_failure", a red mark on every commit):
# the build workflow it calls asks for `contents: write` and the repository's token is read-only by default. It also would
# duplicate the TEST build (1 hour, every platform). Start it by hand: Actions > Full Flutter CI > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
